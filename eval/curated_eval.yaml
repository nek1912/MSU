# eval/curated_eval.yaml
#
# CURATED evaluation set (Phase 1, Task 3). Human-reviewed evidence, separate
# from `gold_cases.yaml` (which is retriever-anchored and used as a regression
# guard). This file is the trustworthy source of truth for Recall targets.
#
# Structure per case:
#   query:              str   - user question exactly as a citizen would ask
#   language:           en|hi - question language
#   answerable:         bool  - false => NO document in the frozen 2,188-chunk
#                              corpus should answer this (off-domain / out_of_scope)
#   expected_document:  str   - source document id this answer must come from
#                              (only for answerable=true)
#   expected_pages:     list  - best-effort page numbers the answer evidence
#                              should sit on (HUMAN REVIEW REQUIRED - do not
#                              trust these blindly)
#   expected_sections:  list  - best-effort section/heading names to cover
#   expected_clauses:   list  - best-effort clause numbers/sub-clauses to cite
#   acceptable_chunk_ids: list - stable chunk_ids (e.g.
#                              "operational_guidelines_pmfby_00012") that are
#                              valid evidence. LEFT EMPTY until a human reviews
#                              each case; DO NOT auto-fill from the retriever.
#
# NOTE: expected_pages / expected_sections / expected_clauses are AGENT-DRAFTED
# and flagged for human verification before this set is treated as authoritative.

