safety:
  - "Do not answer Gujarat statutory-law questions as if this corpus were complete."
  - "Do not present central PACS model bye-laws as automatically applicable Gujarat PACS bye-laws."
  - "If retrieved evidence does not support an answer, abstain."
  - "Do not fetch missing legal facts from the internet during answer generation."
  - "Internet is used only for source acquisition/update workflows, not as runtime evidence."

promotion_rule:
  "Deferred documents may be promoted only after content/provenance validation and evaluation coverage review."
