# Gate 2 configuration — single source of truth for all pass/fail thresholds.
# Target T is set here; do not change after seeing evaluation results.
# Created: 2026-08-27

# Retrieval thresholds
retrieval:
  recall_at_1:
    minimum: 0.40
    target: 0.70
    blocker: true
  recall_at_3:
    minimum: 0.60
    target: 0.85
    blocker: true
  recall_at_5:
    minimum: 0.80
    target: 0.95
    blocker: true
  mrr:
    minimum: 0.50
    target: 0.75
    blocker: true

# Jurisdiction thresholds
jurisdiction:
  contamination:
    maximum: 0
    blocker: true  # HARD BLOCKER — any wrong-state result is a failure

# Domain thresholds
domain:
  accuracy:
    minimum: 0.85
    target: 0.95
    blocker: false  # DIAGNOSTIC — not a hard gate initially

# Evidence/abstention thresholds
evidence:
  unsafe_answer_rate:
    maximum: 0.0
    blocker: true
  abstention_rate:
    min_reasonable: 0.05  # Don't abstain on everything
    max_reasonable: 0.50  # Don't answer everything
  false_abstention_rate:
    maximum: 0.20
    blocker: true

# Citation thresholds
citations:
  provenance_accuracy:
    minimum: 1.0  # 100% — every citation must resolve
    blocker: true

# Metadata
created_date: "2026-08-27"
frozen: false  # Set to true once target is finalized after preliminary evaluation
